<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#ffffff">
<title>Instituto T’Ser | Site em manutenção</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#193f53;font-family:Arial,Helvetica,sans-serif}
main{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:32px 24px;text-align:center}
.content{width:100%;max-width:540px}
.logo{width:min(290px,78vw);margin:0 auto}
.logo-crop{aspect-ratio:728 / 438;overflow:hidden}
.logo-crop img{display:block;width:100%;height:auto}
.tag{font-size:clamp(16px,4.2vw,21px);font-weight:400;letter-spacing:.2px;margin:5px 0 0}
.line{width:48px;height:2px;background:#197b80;margin:clamp(24px,6vw,36px) auto}
h1{font-size:clamp(25px,5.5vw,36px);line-height:1.2;font-weight:600;margin:0 0 16px}
.message{color:#50636b;font-size:clamp(15px,3.8vw,18px);line-height:1.65;margin:0 auto;max-width:440px;text-wrap:pretty}
</style>
</head>
<body><main><section class="content">
<div class="logo"><div class="logo-crop"><img src="/logo-tser.png" alt="Instituto T’Ser" width="728" height="493"></div><p class="tag">Clínico geral</p></div>
<div class="line" aria-hidden="true"></div>
<h1>Site em manutenção</h1>
<p class="message">Estamos atualizando nossas informações para oferecer uma experiência ainda melhor para você.</p>
</section></main></body></html>
